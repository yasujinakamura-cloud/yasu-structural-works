<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Redirect…</title>
  <script>
    (function () {
      var t = new URL("./mobile/index.html", location.href);
      location.replace(t.pathname + (location.search || "") + (location.hash || ""));
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=mobile/index.html" />
</head>
<body>
  <p><a href="mobile/index.html">モバイル入口へ</a></p>
</body>
</html>
